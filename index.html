<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0d0d0f">
<title>Showdown Seekers｜TSL 2026</title>
<style>
  :root{color-scheme:dark;
    --red:#e11d2a;--red2:#b81722;--redbg:rgba(225,29,42,.16);--redtx:#ff7a82;
    --navy:#e11d2a;--navy2:#e11d2a;--tan:#ff7a82;--tanbg:rgba(225,29,42,.16);
    --sun:#ff6b81;--sat:#4ea3ff;--sunbg:rgba(255,107,129,.09);--satbg:rgba(78,163,255,.09);
    --ok:#4ade80;--tri:#fbbf24;--ng:#ff5a5f;
    --line:#34343c;--bg:#0d0d0f;--card:#1a1a1e;--card2:#26262c;--ink:#f0f0f2;--mut:#9a9aa4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP","ＭＳ Ｐゴシック",sans-serif}
  input,textarea{background:var(--card2);color:var(--ink)}
  .wrap{max-width:640px;margin:0 auto;padding:12px 12px 96px}
  .hero{background:linear-gradient(135deg,#c1121f,#6f0c14);color:#fff;border-radius:16px;padding:14px 18px;border:1px solid #7a0d16;display:flex;align-items:center;gap:14px}
  .hero .logo{width:66px;height:66px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 2px 5px rgba(0,0,0,.45))}
  .hero .htx{min-width:0}
  .hero h1{margin:0;font-size:20px;font-weight:800;line-height:1.25}
  .hero .sub{opacity:.9;font-size:12px;letter-spacing:1.5px;margin-top:3px}
  .tabs{display:flex;gap:6px;margin-top:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:5px;position:sticky;top:6px;z-index:20}
  .tab{flex:1;background:transparent;color:var(--mut);border:none;border-radius:9px;padding:10px 6px;font-size:13.5px;font-weight:800;letter-spacing:.3px;cursor:pointer;transition:.15s;white-space:nowrap}
  .tab.active{background:var(--red);color:#fff}
  .panel{display:none}
  .panel.active{display:block}
  .rules{background:var(--card);border-radius:14px;padding:13px 15px;margin-top:12px;font-size:14px;line-height:1.9;border-left:5px solid var(--red)}
  .rules h3{margin:0 0 4px;font-size:14px;color:var(--redtx)}
  .rules .em{color:var(--redtx);font-weight:700}
  .rules-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700;color:var(--ink);font-size:14px}
  .rules-head .chev{font-size:12px;color:var(--mut);transition:.15s}
  .rules-body{margin-top:8px;color:var(--ink)}
  .rulebook{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
  .rulebook a{color:var(--redtx);font-weight:700;text-decoration:underline}
  .bar{display:flex;align-items:center;gap:10px;margin:14px 2px 8px;flex-wrap:wrap}
  .next{background:var(--red);color:#fff;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px}
  .bar label{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:5px}
  .grow{flex:1}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:600;transition:.12s;font-size:14px}
  .btn{background:var(--card2);color:var(--ink);border:1px solid var(--line);padding:9px 14px}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
  .btn.tan{background:#7a1520;color:#fff;border-color:#7a1520}
  .secband{margin:18px 4px 8px;font-size:13px;font-weight:800;letter-spacing:3px;color:var(--redtx);display:flex;align-items:center;gap:8px}
  .secband:before,.secband:after{content:"";height:1px;background:var(--line);flex:1}
  .search{display:flex;gap:8px;margin:0 2px 12px;flex-wrap:wrap;align-items:center}
  .search select{flex:1;min-width:130px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;background:var(--card2);color:var(--ink)}
  .search select:disabled{background:#1e1e22;color:#5a5a62}
  .search .btn{flex:0 0 auto}
  .empty{text-align:center;color:var(--mut);padding:34px 10px;font-size:14px}
  .rankcard{background:var(--card);border-radius:16px;padding:12px 14px;margin:12px 0;border:1px solid var(--line)}
  .rankhead{font-size:14px;font-weight:700;color:var(--redtx);margin-bottom:2px}
  .rankhead2{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:14px;font-weight:700;color:var(--redtx)}
  .rankhead2 .chev{color:var(--mut);font-size:12px}
  .rankbody{margin-top:8px}
  .standwrap{max-height:360px;overflow-y:auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.stand thead th{position:sticky;top:0;background:var(--card);z-index:1}
  .ranksub{font-size:11px;color:var(--mut);margin-bottom:8px}
  .rankrow{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line)}
  .rankrow:last-child{border-bottom:none}
  .rankrow .rk{width:24px;height:24px;border-radius:50%;background:var(--card2);color:var(--ink);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .rankrow.top1 .rk{background:#e8b923;color:#1a1a1e}
  .rankrow.top2 .rk{background:#c0c6d0;color:#1a1a1e}
  .rankrow.top3 .rk{background:#cd8a4b;color:#1a1a1e}
  .rankrow .rname{flex:1;font-weight:600}
  .rankrow .rrole{font-size:10px;color:var(--mut);margin-left:5px;font-weight:400}
  .rankrow .rpt{font-weight:700;color:var(--redtx)}
  .rankrow .rpt em{font-size:11px;color:var(--mut);font-style:normal;margin-left:2px}
  .rankrow .selfbadge{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:6px}
  .rankedit{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px;display:flex;flex-direction:column;gap:6px}
  .rankedit .reself{display:flex;align-items:center;gap:8px}
  .rankedit .reself .lbl{font-size:12px;color:var(--mut);white-space:nowrap}
  .rankedit input{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;font-family:inherit;background:var(--card2);color:var(--ink)}
  .rankedit .reself input{flex:1}
  .rankedit .reteam{display:flex;gap:6px}
  .rankedit .reteam .tname{flex:1}
  .rankedit .reteam .tpt{width:70px;text-align:center}
  .rankedit .tdel{color:var(--ng);padding:6px 10px}
  .lgtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .lgtab{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
  .lgtab.act{background:var(--red);border-color:var(--red);color:#fff}
  table.stand{width:100%;border-collapse:collapse;font-size:13px}
  table.stand th{color:var(--mut);font-weight:600;font-size:11px;padding:4px 4px;text-align:right;border-bottom:1px solid var(--line)}
  table.stand th.l{text-align:left}table.stand th.rk{text-align:center}
  table.stand td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;color:var(--ink)}
  table.stand td.tm{text-align:left;font-weight:600}
  table.stand td.rk{text-align:center;width:26px;color:var(--mut);font-weight:700}
  table.stand td.rk.g{color:#e8b923}table.stand td.rk.s{color:#c0c6d0}table.stand td.rk.b{color:#cd8a4b}
  table.stand tr.self td{background:rgba(225,29,42,.14)}
  table.stand tr.self td.tm{color:var(--redtx)}
  table.stand .lg{font-size:10px;color:var(--mut);margin-left:6px;font-weight:400}
  table.stand td.tot{color:var(--redtx);font-weight:800}
  .card{background:var(--card);border-radius:16px;margin-bottom:12px;overflow:hidden;border:1px solid #232329}
  .chead{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;border-left:6px solid #3a3a42}
  .ctog{margin-left:auto;color:var(--mut);font-size:13px;padding:0 2px;flex:0 0 auto}
  .chead.sun{border-color:var(--sun)}.chead.sat{border-color:var(--sat)}
  .card.past{background:#131315;border-color:#1e1e22;opacity:.82}
  .card.past .gameband{background:#241618;color:#9a6a6e;border-color:#3a2224}
  .card.past .date{color:#8a8a92}
  .done{background:#4a2a2e;color:#ff9aa0;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;margin-left:8px;letter-spacing:.5px}
  .setsu{font-size:12px;font-weight:800;color:var(--redtx);min-width:38px}
  .dwrap{display:flex;align-items:baseline;gap:6px}
  .date{font-size:19px;font-weight:800;color:var(--ink)}
  .wd{font-size:14px;font-weight:800}
  .wd.sun{color:var(--sun)}.wd.sat{color:var(--sat)}
  .game{margin-left:auto;background:var(--redbg);color:var(--redtx);font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px;text-align:right;max-width:52%}
  .info{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 10px;font-size:13.5px}
  .info span{display:inline-flex;align-items:center;gap:4px;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:5px 11px;font-weight:600}
  .info b{color:var(--ink);font-weight:700}
  .info a{color:var(--redtx);text-decoration:underline}
  .gameband{margin:2px 12px 6px;padding:9px 14px;background:var(--redbg);border:1px solid rgba(225,29,42,.32);border-radius:10px;font-size:16px;font-weight:700;color:var(--redtx);letter-spacing:.3px}
  .players{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 12px 2px}
  .players .lbl{font-size:12px;color:var(--mut);font-weight:600}
  .players .chip{background:#241417;color:#ff9aa0;border:1px solid rgba(225,29,42,.42);border-radius:8px;padding:4px 11px;font-size:13.5px;font-weight:600}
  .players .none{color:#6a6a72;font-size:13px}
  .players .lbl.gap{margin-left:12px}
  .stats{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
  .stats .lbl{font-size:12px;color:var(--mut);font-weight:600}
  .stats .lbl:not(:first-child){margin-left:10px}
  .stats .val{background:#241417;color:#ff9aa0;border:1px solid rgba(225,29,42,.42);border-radius:8px;padding:4px 11px;font-size:13.5px;font-weight:600;min-width:34px;text-align:center}
  .metasm{font-size:12.5px;color:var(--mut);padding:6px 14px 12px;display:flex;gap:18px}
  .metasm b{color:var(--ink);font-weight:600}
  .info input{border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:13px;font-family:inherit;width:120px;background:var(--card2);color:var(--ink)}
  .att{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px 12px 4px}
  .m{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:10px;background:var(--card2);min-height:56px;justify-content:center}
  .m .nm{font-size:11px;color:var(--mut);line-height:1.2;text-align:center}
  .m .rl{font-size:9px;color:#7a7a82}
  .m .mk{font-size:22px;font-weight:800;line-height:1}
  .mk.o{color:var(--ok)}.mk.t{color:var(--tri)}.mk.x{color:var(--ng)}.mk.e{color:#55555e}
  .m.ed{cursor:pointer;border:1px dashed var(--line);background:#202027}
  .m.ed:active{background:#2a2a32}
  .crow{display:flex;gap:8px;padding:8px 12px 12px;align-items:center;flex-wrap:wrap}
  .blindbtn{background:var(--card2);color:var(--ink);border:1px solid var(--line);padding:8px 12px;border-radius:10px;font-weight:700;font-size:13px}
  .blindbtn.has{background:var(--red);color:#fff;border-color:var(--red)}
  .meta{display:grid;grid-template-columns:1fr;gap:6px;padding:0 12px 12px}
  .meta .f{display:flex;align-items:center;gap:8px;font-size:13px}
  .meta .f b{color:var(--mut);font-weight:600;min-width:58px}
  .meta input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;font-family:inherit;background:var(--card2);color:var(--ink)}
  .metaview{font-size:13px;color:var(--mut);margin:0 12px;padding:10px 2px 12px;display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line)}
  .metaview span b{color:var(--ink)}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;z-index:60;align-items:flex-end;justify-content:center}
  .ov.open{display:flex}
  .modal{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;border:1px solid var(--line)}
  @media(min-width:600px){.ov{align-items:center}.modal{border-radius:18px}}
  .mh{position:sticky;top:0;background:linear-gradient(135deg,#c1121f,#6f0c14);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
  .mh h3{margin:0;font-size:15px;flex:1;line-height:1.3}
  .mh .x{background:transparent;color:#fff;font-size:24px;padding:0 4px;border:none}
  .mb{padding:14px 16px 20px;color:var(--ink)}
  .mbinfo{font-size:13.5px;color:var(--mut);margin-bottom:12px;display:flex;gap:14px;flex-wrap:wrap}
  .mbinfo b{color:var(--redtx);font-weight:700}
  .mbinfo label{font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
  .points{margin:2px 0 14px}
  .points .ptitle{font-size:13px;font-weight:700;color:var(--redtx);margin-bottom:6px}
  .pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .pgrid span{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 3px;text-align:center;font-size:12.5px;color:var(--ink)}
  .pgrid span b{color:var(--redtx);display:block;font-size:11px;margin-bottom:1px;font-weight:700}
  .pnote{font-size:12px;color:var(--mut);margin-top:6px}
  table.bl{width:100%;border-collapse:collapse;font-size:14px}
  table.bl th{background:#2a2a30;color:var(--ink);padding:8px 4px;font-size:12px;font-weight:700}
  table.bl td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);color:var(--ink)}
  table.bl tr.brk td{background:#153f34;color:#7fe6c4;font-weight:700;letter-spacing:1px}
  table.bl input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 2px;text-align:center;font-size:14px;font-family:inherit;background:var(--card2);color:var(--ink)}
  .savebar{position:fixed;left:0;right:0;bottom:0;background:#141418;border-top:1px solid var(--line);padding:10px 12px;display:none;gap:8px;z-index:40;justify-content:center;flex-wrap:wrap}
  .mode-edit .savebar{display:flex}
  .savebar .btn{flex:1;min-width:120px;max-width:220px;padding:12px}
  .banner{background:#2a2410;border:1px solid #5a4a15;color:#e8c14d;border-radius:10px;padding:9px 12px;font-size:12.5px;margin:10px 2px;display:none}
  .mode-edit .banner{display:block}
  .only-edit{display:none}.mode-edit .only-edit{display:inline-flex}
  .mode-edit .only-view{display:none}
  .foot{color:var(--mut);font-size:12px;margin:16px 4px;line-height:1.8}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<script>
let data=JSON.parse(document.getElementById('tsl-data').textContent);
const LS='tsl_schedule_v3';
try{const s=localStorage.getItem(LS);if(s)data=JSON.parse(s);}catch(e){}
let editing=false,curEvent=null;let collapsed={};
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls=m=>m==='○'?'o':m==='△'?'t':m==='×'?'x':'e';
const isBrk=r=>r.sb===''||r.sb==null;
const lvCount=b=>(b||[]).filter(r=>!isBrk(r)).length;
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(data));}catch(e){}};
const CYCLE=['','○','△','×'];
function renderTop(){
  $('#pgtitle').textContent=data.title;$('#pgsub').textContent=data.subtitle;
  const body=data.rules.map(x=>`<div>■${esc(x.text)}<span class="em">${esc(x.em)}</span>${esc(x.tail||'')}</div>`).join('');
  const rb=data.rulebook?`<div class="rulebook"><a href="${esc(data.rulebook)}" target="_blank" rel="noopener">📖 公式ルールブックを開く ↗</a></div>`:'';
  const closed='📋 ルール　🔗ルールブックリンク有（タップで表示）',open2='📋 ルール　🔗ルールブックリンク有';
  $('#rules').innerHTML=`<div class="rules-head" id="rulesHead"><span>${open2}</span><span class="chev" id="rulesChev">▲</span></div><div class="rules-body" id="rulesBody" style="display:block">${body}${rb}</div>`;
  const bd=$('#rulesBody'),cv=$('#rulesChev'),hd=$('#rulesHead');
  hd.addEventListener('click',()=>{const open=bd.style.display!=='none';bd.style.display=open?'none':'block';cv.textContent=open?'▼':'▲';hd.querySelector('span').textContent=open?closed:open2;});
}
let search={cat:'',val:''};
function vis(){let evs=data.events;
  if($('#up').checked){const t=new Date();t.setHours(0,0,0,0);evs=evs.filter(e=>new Date(e.date)>=t);}
  if(search.cat&&search.val){evs=evs.filter(e=>{
    if(search.cat==='players')return (e.players||'').split('・').includes(search.val);
    if(search.cat==='game')return e.game===search.val;
    if(search.cat==='date')return e.label===search.val;return true;});}
  return evs;}
function updateNext(){const t=new Date();t.setHours(0,0,0,0);const n=data.events.find(e=>new Date(e.date)>=t);
  $('#next').textContent=n?`次戦 ${n.label}(${n.weekday}) ${n.game}`:'シーズン終了';}
function venueUrl(v){if(!v)return '';const m=data.venueMaps||{};if(m[v])return m[v];if(v.indexOf('カジスタ')>=0)return m['カジスタ東京']||'';if(v.indexOf('VERTEX')>=0||v.indexOf('ベルテック')>=0)return m['VERTEX TOKYO']||'';return '';}
let rankView='東西';
let rankOpen=true;
function renderRanking(){
  const el=$('#ranking');if(!el)return;const L=data.leagues||{};
  const tabs=['総合',...Object.keys(L)];
  let h='<div class="rankcard"><div class="rankhead2" id="rankHead"><span>🏆 リーグ順位表</span><span class="chev">'+(rankOpen?'▲':'▼')+'</span></div>';
  h+='<div class="rankbody" style="'+(rankOpen?'':'display:none')+'"><div class="ranksub">出典: TOKYO SUPER LEAGUE 公式（R4時点）</div>';
  h+='<div class="lgtabs">'+tabs.map(t=>`<span class="lgtab${t===rankView?' act':''}" data-lg="${esc(t)}">${esc(t)}</span>`).join('')+'</div>';
  const isAll=rankView==='総合';let rows;
  if(isAll){rows=[];Object.keys(L).forEach(lg=>L[lg].forEach(r=>rows.push({team:r[0],r1:r[1],r2:r[2],r3:r[3],r4:r[4],tot:r[5],lg:lg})));rows.sort((a,b)=>b.tot-a.tot);}
  else{rows=(L[rankView]||[]).map(r=>({team:r[0],r1:r[1],r2:r[2],r3:r[3],r4:r[4],tot:r[5],lg:rankView}));}
  let rank=0,prev=null;rows.forEach((x,i)=>{if(x.tot!==prev){rank=i+1;prev=x.tot;}x.rank=rank;});
  h+='<div class="standwrap"><table class="stand"><thead><tr><th class="rk">#</th><th class="l">チーム</th><th>R1</th><th>R2</th><th>R3</th><th>R4</th><th>合計</th></tr></thead><tbody>';
  rows.forEach(x=>{const self=x.team.replace(/\s/g,'').toLowerCase()==='showdownseekers';
    const med=x.rank===1?' g':x.rank===2?' s':x.rank===3?' b':'';
    h+=`<tr class="${self?'self':''}"><td class="rk${med}">${x.rank}</td><td class="tm">${esc(x.team)}${isAll?`<span class="lg">${esc(x.lg)}</span>`:''}</td><td>${x.r1}</td><td>${x.r2}</td><td>${x.r3==null?'—':x.r3}</td><td>${x.r4==null?'—':x.r4}</td><td class="tot">${x.tot}<span style="font-size:10px;color:var(--mut);font-weight:400">pt</span></td></tr>`;});
  h+='</tbody></table></div></div></div>';el.innerHTML=h;
  el.querySelector('#rankHead').addEventListener('click',()=>{rankOpen=!rankOpen;renderRanking();});
  el.querySelectorAll('.lgtab').forEach(t=>t.addEventListener('click',()=>{rankView=t.dataset.lg;renderRanking();}));
}
function render(){
  renderRanking();
  const L=$('#list');L.innerHTML='';const evs=vis();let sec='';
  if(!evs.length){L.innerHTML='<div class="empty">該当する予定がありません</div>';updateNext();return;}
  evs.forEach(e=>{
    const gi=data.events.indexOf(e);
    if(e.section==='post'&&sec!=='post'){const b=document.createElement('div');b.className='secband';b.textContent='POST SEASON';L.appendChild(b);}
    sec=e.section;
    const card=document.createElement('div');
    const _t=new Date();_t.setHours(0,0,0,0);const past=new Date(e.date)<_t;
    card.className='card'+(past?' past':'');
    const wc=e.weekday==='日'?'sun':e.weekday==='土'?'sat':'';
    const isC=(e.id in collapsed)?collapsed[e.id]:past;
    let h=`<div class="chead ${wc}"><span class="setsu">${e.section==='post'?'PS':esc(e.setsu)}</span>${past?'<span class="done">実施済</span>':''}`;
    h+=`<div class="dwrap"><span class="date">${esc(e.label)}</span><span class="wd ${wc}">(${esc(e.weekday)})</span></div><span class="ctog">${isC?'▼':'▲'}</span></div>`;
    if(editing) h+=`<div class="gameband"><input class="game-in" data-i="${gi}" value="${esc(e.game)}" placeholder="種目" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:15px;font-weight:700;font-family:inherit;color:var(--tan)"></div>`;
    else h+=`<div class="gameband">${esc(e.game)}</div>`;
    h+=`<div class="cbody"${isC?' style="display:none"':''}>`;
    if(editing){
      h+=`<div class="info"><span>⏰<input data-f="start" data-i="${gi}" value="${esc(e.start||'')}" placeholder="18:30"></span>`+
         `<span>📍<input data-f="venue" data-i="${gi}" value="${esc(e.venue||'')}" placeholder="会場"></span></div>`;
    }else if(e.start||e.venue){
      const vu=venueUrl(e.venue);
      h+=`<div class="info">`+(e.start?`<span>⏰ <b>${esc(e.start)}</b></span>`:'')+(e.venue?`<span>📍 ${vu?`<a href="${esc(vu)}" target="_blank" rel="noopener"><b>${esc(e.venue)}</b> ↗</a>`:`<b>${esc(e.venue)}</b>`}</span>`:'')+`</div>`;
    }
    h+=`<div class="att">`;
    data.members.forEach(m=>{const v=e.attendance[m.name]||'';
      h+=`<div class="m ${editing?'ed':''}" ${editing?`data-att="${gi}" data-m="${esc(m.name)}"`:''}>`+
         `<span class="nm">${esc(m.name)}</span>`+(m.role?`<span class="rl">${esc(m.role)}</span>`:'')+
         `<span class="mk ${cls(v)}">${v||'—'}</span></div>`;});
    h+=`</div>`;
    if(!editing){const pl=(e.players||'').split('・').map(s=>s.trim()).filter(Boolean);
      h+=`<div class="players"><span class="lbl">出場者</span>`+(pl.length?pl.map(p=>`<span class="chip">${esc(p)}</span>`).join(''):`<span class="none">未定</span>`)+`<span class="lbl gap">Re回数</span><span class="chip">${esc(e.reentry)||'—'}</span></div>`;}
    const n=lvCount(e.blinds);
    h+=`<div class="crow"><button class="blindbtn ${n?'has':''}" data-blind="${gi}">🃏 ブラインド${n?' '+n+'Lv':''}</button></div>`;
    if(editing){
      h+=`<div class="meta">`+['players|出場者','reentry|Re回数'].map(f=>{const[k,lb]=f.split('|');
          return `<div class="f"><b>${lb}</b><input data-f="${k}" data-i="${gi}" value="${esc(e[k]||'')}"></div>`;}).join('')+
        `<button class="btn" style="color:var(--ng)" data-del="${gi}">この予定を削除</button></div>`;
    }
    h+=`</div>`;card.innerHTML=h;const _hd=card.querySelector(".chead"),_bd=card.querySelector(".cbody"),_tg=card.querySelector(".ctog");if(_hd&&_bd){_hd.style.cursor="pointer";_hd.addEventListener("click",()=>{const c=_bd.style.display==="none";_bd.style.display=c?"":"none";if(_tg)_tg.textContent=c?"▲":"▼";collapsed[e.id]=!c;});}L.appendChild(card);
  });
  bind();updateNext();
}
function bind(){
  document.querySelectorAll('.m.ed').forEach(el=>el.addEventListener('click',()=>{
    const gi=+el.dataset.att,m=el.dataset.m,cur=data.events[gi].attendance[m]||'';
    const nx=CYCLE[(CYCLE.indexOf(cur)+1)%4];data.events[gi].attendance[m]=nx;save();
    const mk=el.querySelector('.mk');mk.textContent=nx||'—';mk.className='mk '+cls(nx);}));
  document.querySelectorAll('.game-in').forEach(i=>i.addEventListener('input',()=>{data.events[+i.dataset.i].game=i.value;save();}));
  document.querySelectorAll('.info input,.meta input').forEach(i=>i.addEventListener('input',()=>{data.events[+i.dataset.i][i.dataset.f]=i.value;save();}));
  document.querySelectorAll('button[data-blind]').forEach(b=>b.addEventListener('click',()=>openBlinds(+b.dataset.blind)));
  document.querySelectorAll('button[data-del]').forEach(b=>b.addEventListener('click',()=>{if(confirm('この予定を削除しますか？')){data.events.splice(+b.dataset.del,1);save();render();}}));
}
function openBlinds(gi){curEvent=gi;const e=data.events[gi];
  $('#ovTitle').textContent=`${e.section==='post'?'':e.setsu+' '}${e.game}｜${e.label}(${e.weekday})`;
  drawBlinds();$('#ov').classList.add('open');}
function drawBlinds(){
  const e=data.events[curEvent],rows=e.blinds||[];
  let h='';
  if(editing){h+=`<div class="mbinfo"><label>初期スタック<input class="cfg" data-k="stack" value="${esc(e.stack||'')}" placeholder="30,000点" style="border:1px solid var(--line);border-radius:7px;padding:6px;font-size:13px;font-family:inherit;width:160px"></label><label>リエントリー<input class="cfg" data-k="reentryMax" value="${esc(e.reentryMax||'')}" placeholder="1回まで" style="border:1px solid var(--line);border-radius:7px;padding:6px;font-size:13px;font-family:inherit;width:120px"></label></div>`;}
  else if(e.stack||e.reentryMax){h+=`<div class="mbinfo"><span>🎯 初期スタック <b>${esc(e.stack||'-')}</b></span><span>🔁 リエントリー <b>${esc(e.reentryMax||'-')}</b></span></div>`;}
  if(e.points&&e.points.length){h+=`<div class="points"><div class="ptitle">順位ポイント</div><div class="pgrid">`+e.points.map(p=>`<span><b>${esc(p[0])}</b>${esc(p[1])}pt</span>`).join('')+`</div>`+(e.pointsNote?`<div class="pnote">${esc(e.pointsNote)}</div>`:'')+`</div>`;}
  h+='<table class="bl"><thead><tr><th>Lv</th><th>SB</th><th>BB</th><th>アンティ</th><th>分</th>'+(editing?'<th></th>':'')+'</tr></thead><tbody>';
  if(!rows.length)h+=`<tr><td colspan="${editing?6:5}" style="color:#98a2b3;padding:16px">未登録${editing?'（下で追加）':''}</td></tr>`;
  rows.forEach((r,i)=>{const brk=isBrk(r);
    if(editing)h+=`<tr class="${brk?'brk':''}">
      <td><input class="bi" data-r="${i}" data-k="lv" value="${esc(r.lv)}"></td>
      <td><input class="bi" data-r="${i}" data-k="sb" value="${esc(r.sb)}"></td>
      <td><input class="bi" data-r="${i}" data-k="bb" value="${esc(r.bb)}"></td>
      <td><input class="bi" data-r="${i}" data-k="ante" value="${esc(r.ante)}"></td>
      <td><input class="bi" data-r="${i}" data-k="dur" value="${esc(r.dur)}"></td>
      <td><button class="btn" style="padding:6px 9px;color:var(--ng)" data-bd="${i}">✕</button></td></tr>`;
    else{if(brk)h+=`<tr class="brk"><td colspan="4">${esc(r.lv)}</td><td>${esc(r.dur)}分</td></tr>`;
      else h+=`<tr><td>${esc(r.lv)}</td><td>${esc(r.sb)}</td><td>${esc(r.bb)}</td><td>${esc(r.ante)}</td><td>${esc(r.dur)}</td></tr>`;}});
  h+='</tbody></table>';
  if(editing)h+=`<div style="display:flex;gap:8px;margin-top:14px"><button class="btn tan" id="addLv" style="flex:1;padding:12px">＋ レベル</button><button class="btn" id="addBrk" style="flex:1;padding:12px">＋ Break</button></div>`;
  $('#ovBody').innerHTML=h;
  if(editing){
    document.querySelectorAll('.bi').forEach(i=>i.addEventListener('input',()=>{let v=i.value,k=i.dataset.k;
      if(['sb','bb','ante','dur'].includes(k)&&v!==''&&!isNaN(v))v=+v;data.events[curEvent].blinds[+i.dataset.r][k]=v;save();}));
    document.querySelectorAll('.cfg').forEach(i=>i.addEventListener('input',()=>{data.events[curEvent][i.dataset.k]=i.value;save();}));
    document.querySelectorAll('button[data-bd]').forEach(b=>b.addEventListener('click',()=>{data.events[curEvent].blinds.splice(+b.dataset.bd,1);save();drawBlinds();render();}));
    $('#addLv').addEventListener('click',()=>{const bl=data.events[curEvent].blinds;bl.push({lv:lvCount(bl)+1,sb:'',bb:'',ante:'',dur:15});save();drawBlinds();render();});
    $('#addBrk').addEventListener('click',()=>{data.events[curEvent].blinds.push({lv:'Break',sb:'',bb:'',ante:'',dur:10});save();drawBlinds();render();});
  }
}
function setMode(on){editing=on;document.body.classList.toggle('mode-edit',on);render();}
$('#editBtn').addEventListener('click',()=>{const p=prompt('編集用パスコード');if(p===null)return;p===data.passcode?setMode(true):alert('パスコードが違います');});
$('#exitBtn').addEventListener('click',()=>setMode(false));
$('#up').addEventListener('change',render);
function uniq(a){return [...new Set(a)];}
function fillVals(){const cat=$('#scat').value;search.cat=cat;search.val='';const sv=$('#sval');
  if(!cat){sv.disabled=true;sv.innerHTML='<option value="">—</option>';render();return;}
  sv.disabled=false;let opts=[];
  if(cat==='players')opts=data.members.map(m=>[m.name,m.name]);
  else if(cat==='game')opts=uniq(data.events.map(e=>e.game).filter(Boolean)).map(g=>[g,g]);
  else if(cat==='date')opts=data.events.map(e=>[e.label,`${e.label}(${e.weekday}) ${e.game}`]);
  sv.innerHTML='<option value="">すべて表示</option>'+opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('');render();}
$('#scat').addEventListener('change',fillVals);
$('#sval').addEventListener('change',()=>{search.val=$('#sval').value;render();});
$('#sclear').addEventListener('click',()=>{$('#scat').value='';fillVals();});
$('#addBtn').addEventListener('click',()=>{const l=prompt('日付 (例 8/13)');if(!l)return;const[mo,da]=l.split('/').map(x=>parseInt(x,10));
  const wn=['日','月','火','水','木','金','土'];const d=new Date(2026,mo-1,da);const at={};data.members.forEach(m=>at[m.name]='');
  data.events.push({id:l+'-n',setsu:prompt('節 (例 第22節、空欄可)')||'',section:'regular',date:`2026-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`,label:`${mo}/${da}`,weekday:wn[d.getDay()],game:prompt('種目')||'',start:'',venue:'',attendance:at,players:'',reentry:'',result:'',blinds:[]});
  data.events.sort((a,b)=>new Date(a.date)-new Date(b.date)||(a.section>b.section?1:-1));save();render();});
function dl(n,c,t){const b=new Blob([c],{type:t}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u);}
$('#saveBtn').addEventListener('click',()=>{document.getElementById('tsl-data').textContent=JSON.stringify(data);
  const we=document.body.classList.contains('mode-edit');document.body.classList.remove('mode-edit');
  const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;if(we)document.body.classList.add('mode-edit');dl('index.html',html,'text/html');});
$('#expBtn').addEventListener('click',()=>dl('tsl_data.json',JSON.stringify(data,null,2),'application/json'));
$('#impFile').addEventListener('change',ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();renderTop();render();alert('読み込みました');}catch(e){alert('読み込み失敗');}};r.readAsText(f);});
$('#ovClose').addEventListener('click',()=>$('#ov').classList.remove('open'));
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')$('#ov').classList.remove('open');});
$('#foot').innerHTML='公開: このファイル(index.html)をGitHub Pages等に置くと、リンクを知る人は誰でも閲覧できます。<br>更新: 「編集」で変更→「保存(DL)」→公開先のindex.htmlを差し替え。編集パスコード初期値 tsl2026。';
renderTop();setMode(false);
</script>
<script>
(function(){
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  var panels=[].slice.call(document.querySelectorAll('.panel'));
  var KEY='tsl_tab_v1';
  function activate(name){
    tabs.forEach(function(t){t.classList.toggle('active',t.getAttribute('data-tab')===name);});
    panels.forEach(function(p){p.classList.toggle('active',p.getAttribute('data-panel')===name);});
    try{localStorage.setItem(KEY,name);}catch(e){}
    window.scrollTo(0,0);
  }
  tabs.forEach(function(t){t.addEventListener('click',function(){activate(t.getAttribute('data-tab'));});});
  var init='schedule';try{var v=localStorage.getItem(KEY);if(v)init=v;}catch(e){}
  if(!panels.some(function(p){return p.getAttribute('data-panel')===init;}))init='schedule';
  activate(init);
})();
</script>
